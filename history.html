<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>История заказов - Food Construct</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="history.css">
</head>
<body>
    <header>
        <h1>Food Construct</h1>
        <nav>
            <a href="index.html">Главная</a>
            <a href="lunch.html">Собрать ланч</a>
            <a href="orders.html">Оформить заказ</a>
            <a href="history.html" id="active">Заказы</a>
            <a href="index.html#contacts">Контакты</a>
        </nav>
    </header>

    <main>
        <section class="history-section">
            <h2>История заказов</h2>
            
            <div class="filters">
                <button class="filter-btn active" data-filter="all">Все заказы</button>
                <button class="filter-btn" data-filter="delivered">Доставленные</button>
                <button class="filter-btn" data-filter="pending">В процессе</button>
            </div>
            
            <div id="orders-container" class="orders-container">
                <div class="loading-message">Загрузка истории заказов...</div>
            </div>
        </section>
    </main>

    <footer id="contacts">
        <p>Позвонить нам: <a href="tel:+70000000000">+7-000-000-00-00</a></p>
    </footer>

    <!-- Модальное окно просмотра -->
    <div id="view-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Просмотр заказа</h2>
            <div id="view-modal-content"></div>
            <div class="modal-buttons">
                <button class="modal-btn ok-btn">Ок</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно редактирования -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Редактирование заказа</h2>
            <form id="edit-order-form">
                <div id="edit-modal-content"></div>
                <div class="modal-buttons">
                    <button type="submit" class="modal-btn save-btn">Сохранить</button>
                    <button type="button" class="modal-btn cancel-btn">Отмена</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Модальное окно удаления -->
    <div id="delete-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Удаление заказа</h2>
            <div class="modal-text">
                <p>Вы уверены, что хотите удалить этот заказ?</p>
                <p>Это действие нельзя отменить.</p>
            </div>
            <div class="modal-buttons">
                <button id="confirm-delete" class="modal-btn delete-confirm-btn">Да</button>
                <button class="modal-btn cancel-btn">Отмена</button>
            </div>
        </div>
    </div>

    <script src="history.js"></script>
</body>
</html>
