<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>История заказов - Food Construct</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="history.css">
</head>
<body>
    <header>
        <h1>Food Construct</h1>
        <nav>
            <a href="index.html">О нас</a>
            <a href="lunch.html">Собрать ланч</a>
            <a href="orders.html">Оформить заказ</a>
            <a href="history.html" id="active">Заказы</a>
            <a href="index.html#contacts">Контакты</a>
        </nav>
    </header>

    <main>
        <section class="orders-history-section">
            <h2>История заказов</h2>
            <div id="orders-container">
                <div class="loading-message">Загрузка заказов...</div>
            </div>
        </section>
    </main>

    <footer id="contacts">
        <p>Позвонить нам: <a href="tel:+70000000000">+7-000-000-00-00</a></p>
    </footer>

    <!-- Модальное окно просмотра заказа -->
    <div id="view-order-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>Детали заказа</h3>
                <button class="close-btn" title="Закрыть">&times;</button>
            </div>
            <div class="modal-body">
                <div class="order-details-grid">
                    <div class="order-detail-item">
                        <label>Номер заказа:</label>
                        <p id="view-order-id">-</p>
                    </div>
                    <div class="order-detail-item">
                        <label>Дата оформления:</label>
                        <p id="view-order-date">-</p>
                    </div>
                    <div class="order-detail-item">
                        <label>Имя:</label>
                        <p id="view-order-name">-</p>
                    </div>
                    <div class="order-detail-item">
                        <label>Email:</label>
                        <p id="view-order-email">-</p>
                    </div>
                    <div class="order-detail-item">
                        <label>Телефон:</label>
                        <p id="view-order-phone">-</p>
                    </div>
                    <div class="order-detail-item">
                        <label>Адрес доставки:</label>
                        <p id="view-order-address">-</p>
                    </div>
                    <div class="order-detail-item">
                        <label>Время доставки:</label>
                        <p id="view-order-time">-</p>
                    </div>
                    <div class="order-detail-item">
                        <label>Стоимость:</label>
                        <p id="view-order-price">-</p>
                    </div>
                </div>
                <div class="order-detail-item">
                    <label>Состав заказа:</label>
                    <div class="order-dishes-list" id="view-order-dishes"></div>
                </div>
                <div class="order-detail-item">
                    <label>Комментарий:</label>
                    <p id="view-order-comment">-</p>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" id="close-view-btn" title="Закрыть окно">Ок</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно редактирования заказа -->
    <div id="edit-order-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>Редактирование заказа</h3>
                <button class="close-btn" title="Закрыть">&times;</button>
            </div>
            <form id="edit-order-form" class="edit-form">
                <div class="modal-body">
                    <input type="hidden" id="edit-order-id">
                    <div class="order-details-grid">
                        <div class="form-group">
                            <label for="edit-order-name">Имя *</label>
                            <input type="text" id="edit-order-name" name="full_name" required
                                   title="Введите ваше имя"
                                   placeholder="Иван Иванов">
                        </div>
                        <div class="form-group">
                            <label for="edit-order-email">Email *</label>
                            <input type="email" id="edit-order-email" name="email" required
                                   title="Введите ваш email"
                                   placeholder="ivan@example.com">
                        </div>
                        <div class="form-group">
                            <label for="edit-order-phone">Телефон *</label>
                            <input type="tel" id="edit-order-phone" name="phone" required
                                   title="Введите ваш номер телефона"
                                   placeholder="+7 (999) 123-45-67">
                        </div>
                        <div class="form-group">
                            <label for="edit-order-address">Адрес доставки *</label>
                            <input type="text" id="edit-order-address" name="delivery_address" required
                                   title="Введите адрес доставки"
                                   placeholder="ул. Примерная, д. 1, кв. 1">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Время доставки *</label>
                        <div class="radio-group">
                            <div class="radio-option">
                                <input type="radio" id="edit-delivery-asap" name="delivery_type" value="asap" checked
                                       title="Доставка как можно скорее">
                                <label for="edit-delivery-asap">Как можно скорее (с 7:00 до 23:00)</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="edit-delivery-scheduled" name="delivery_type" value="scheduled"
                                       title="Доставка к указанному времени">
                                <label for="edit-delivery-scheduled">К указанному времени</label>
                            </div>
                        </div>
                        <div class="time-input-container" id="edit-time-panel">
                            <input type="time" id="edit-delivery-time" name="delivery_time" 
                                   min="07:00" max="23:00"
                                   title="Выберите время доставки с 7:00 до 23:00"
                                   placeholder="чч:мм">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="edit-order-comment">Комментарий к заказу</label>
                        <textarea id="edit-order-comment" name="comment" rows="3" 
                                  title="Введите комментарий к заказу"
                                  placeholder="Например: позвонить перед доставкой"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="cancel-edit-btn" title="Отменить редактирование">Отмена</button>
                    <button type="submit" class="btn btn-primary" id="save-edit-btn" title="Сохранить изменения">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Модальное окно удаления заказа -->
    <div id="delete-order-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>Удаление заказа</h3>
                <button class="close-btn" title="Закрыть">&times;</button>
            </div>
            <div class="modal-body">
                <div class="delete-confirmation">
                    <p>Вы уверены, что хотите удалить этот заказ?</p>
                    <p><strong>Эта операция необратима.</strong></p>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="cancel-delete-btn" title="Отменить удаление">Отмена</button>
                <button type="button" class="btn btn-danger" id="confirm-delete-btn" title="Подтвердить удаление">Да, удалить</button>
            </div>
        </div>
    </div>

    <script src="orderValidator.js"></script>
    <script src="historyStorage.js"></script>
    <script src="historyManager.js"></script>
</body>
</html>
