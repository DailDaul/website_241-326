<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Собрать ланч - Food Construct</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="lunch.css">
</head>
<body>
    <header>
        <h1>Food Construct</h1>
        <nav>
            <a href="index.html">Главная</a>
            <a href="lunch.html" id="active">Собрать ланч</a>
            <a href="orders.html">Заказы</a>
            <a href="index.html#contacts">Контакты</a>
        </nav>
    </header>

    <main>
        <!-- Блок с супами -->
        <section id="soups">
            <h2>Супы</h2>
            <div class="dishes-grid"></div>
        </section>

        <!-- Блок с главными блюдами -->
        <section id="main-dishes">
            <h2>Главные блюда</h2>
            <div class="dishes-grid"></div>
        </section>

        <!-- Блок с напитками -->
        <section id="drinks">
            <h2>Напитки</h2>
            <div class="dishes-grid"></div>
        </section>

        <!-- Блок оформления заказа -->
        <section class="order-section">
            <h2>Сделать заказ</h2>
            <div class="current-order">
                <h3>Ваш заказ</h3>
                <div id="empty-message" class="empty-message">Ничего не выбрано</div>
                
                <div class="order-category">
                    <h4 id="soup-title" style="display: none;">Суп</h4>
                    <div id="selected-soup" class="selected-dishes"></div>
                </div>
                
                <div class="order-category">
                    <h4 id="main-title" style="display: none;">Главное блюдо</h4>
                    <div id="selected-main" class="selected-dishes"></div>
                </div>
                
                <div class="order-category">
                    <h4 id="drink-title" style="display: none;">Напиток</h4>
                    <div id="selected-drink" class="selected-dishes"></div>
                </div>
                
                <div id="order-total" class="order-total" style="display: none;">
                    <h4>Стоимость заказа</h4>
                    <div class="total-price">
                        <span id="total-price">0</span>Р
                    </div>
                </div>
            </div>

            <form class="order-form" method="POST" action="https://httpbin.org/post">
                <div class="form-columns">
                    <!-- Блок с данными клиента -->
                    <div class="client-block">
                        <h3>Ваши данные</h3>
                        
                        <div class="form-group">
                            <label for="name">Имя</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="phone">Телефон</label>
                            <input type="tel" id="phone" name="phone" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="address">Адрес доставки</label>
                            <input type="text" id="address" name="address" required>
                        </div>
                        
                        <div class="form-buttons">
                            <button type="submit" class="submit-btn">Отправить заказ</button>
                        </div>
                    </div>
                </div>
            </form>
        </section>
    </main>

    <footer id="contacts">
        <p>Позвонить нам: <a href="tel:+70000000000">+7-000-000-00-00</a></p>
    </footer>

    <script src="dishes.js"></script>
    <script src="displayDishes.js"></script>
    <script src="orderManager.js"></script>
</body>
</html>
