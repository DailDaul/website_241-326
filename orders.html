<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказы - Food Construct</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="orders.css">
</head>
<body>
    <header>
        <h1>Food Construct</h1>
        <nav>
            <a href="index.html">Главная</a>
            <a href="lunch.html">Собрать ланч</a>
            <a href="orders.html" id="active">Заказы</a>
            <a href="index.html#contacts">Контакты</a>
        </nav>
    </header>

    <main>
        <section class="order-form-section">
            <h2>Оформление заказа</h2>
            <form class="order-form" method="POST" action="https://httpbin.org/post">
                <div class="form-columns">
                    <div class="order-block">
                        <h3>Ваш заказ</h3>
                        
                        <div class="form-group">
                            <label for="soup">Супы</label>
                            <select id="soup" name="soup" required>
                                <option value="">Выберите суп</option>
                                <option value="tom-yam">Том Ям с креветками - 365Р</option>
                                <option value="norwegian-soup">Норвежский суп - 270Р</option>
                                <option value="chicken-soup">Куриный суп с лапшой - 220Р</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="main-dish">Главные блюда</label>
                            <select id="main-dish" name="main_dish" required>
                                <option value="">Выберите главное блюдо</option>
                                <option value="lasagna">Лазанья - 385Р</option>
                                <option value="fried-potatoes">Жареная картошка с грибами - 150Р</option>
                                <option value="chicken-cutlets">Котлеты из курицы с картофельным пюре - 225Р</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="drink">Напитки</label>
                            <select id="drink" name="drink" required>
                                <option value="">Выберите напиток</option>
                                <option value="latte">Кофе латте - 180Р</option>
                                <option value="orange-juice">Апельсиновый сок - 120Р</option>
                                <option value="green-tea">Зеленый чай - 90Р</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="comment">Комментарий к заказу</label>
                            <textarea id="comment" name="comment" rows="4" placeholder="Ваши пожелания..."></textarea>
                        </div>
                    </div>
                    
                    <!-- Блок с данными клиента -->
                    <div class="client-block">
                        <h3>Данные для доставки</h3>
                        
                        <div class="form-group">
                            <label for="name">Имя *</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="email">Email *</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        
                        <div class="form-group checkbox-group">
                            <input type="checkbox" id="subscription" name="subscription" checked>
                            <label for="subscription">Подписаться на рассылку</label>
                        </div>
                        
                        <div class="form-group">
                            <label for="phone">Телефон *</label>
                            <input type="tel" id="phone" name="phone" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="address">Адрес доставки *</label>
                            <input type="text" id="address" name="address" required>
                        </div>
                        
                        <div class="form-group">
                            <label>Время доставки *</label>
                            <div class="radio-group">
                                <div class="radio-option">
                                    <input type="radio" id="time-soon" name="delivery_time" value="soon" required>
                                    <label for="time-soon">Как можно скорее</label>
                                </div>
                                <div class="radio-option">
                                    <input type="radio" id="time-specific" name="delivery_time" value="specific">
                                    <label for="time-specific">Ко времени</label>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="specific-time">Укажите время</label>
                            <input type="time" id="specific-time" name="specific_time" min="07:00" max="23:00" step="300">
                        </div>
                        
                        <div class="form-buttons">
                            <button type="reset" class="reset-btn">Сбросить</button>
                            <button type="submit" class="submit-btn">Отправить заказ</button>
                        </div>
                    </div>
                </div>
            </form>
        </section>
    </main>

    <footer id="contacts">
        <p>Позвонить нам: <a href="tel:+70000000000">+7-000-000-00-00</a></p>
    </footer>
</body>
</html>
