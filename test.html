<!DOCTYPE html>
<html>
<head>
    <title>Тест сохранения заказа</title>
    <script>
        function testSaveOrder() {
            const testOrder = {
                id: 1,
                created_at: new Date().toISOString(),
                full_name: 'Тестовый Пользователь',
                email: 'test@example.com',
                phone: '+79991234567',
                delivery_address: 'Тестовый адрес',
                delivery_type: 'asap',
                delivery_time: null,
                comment: 'Тестовый заказ',
                total_price: 500,
                dishes: [
                    { name: 'Гаспачо', price: 365 },
                    { name: 'Апельсиновый сок', price: 120 }
                ]
            };
            
            localStorage.setItem('foodConstruct_orders', JSON.stringify([testOrder]));
            alert('Тестовый заказ сохранен! Проверьте страницу "Заказы".');
        }
        
        function clearTestOrder() {
            localStorage.removeItem('foodConstruct_orders');
            alert('Тестовые данные удалены!');
        }
    </script>
</head>
<body>
    <h1>Тест сохранения заказа</h1>
    <button onclick="testSaveOrder()">Сохранить тестовый заказ</button>
    <button onclick="clearTestOrder()">Очистить тестовые данные</button>
    <br><br>
    <a href="history.html">Перейти к истории заказов</a>
</body>
</html>
